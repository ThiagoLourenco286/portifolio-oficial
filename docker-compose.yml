version: "3.8"
services:
  postgres:
    image: postgres:17
    container_name: portifolio
    restart: always
    ports:
      - "5437:5432"
    environment:
      POSTGRES_USER: thiaguets.port
      POSTGRES_PASSWORD: tpt5483
      POSTGRES_DB: portf
    volumes:
      - ./pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
